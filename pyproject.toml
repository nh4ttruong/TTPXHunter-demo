[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttpxhunter"
version = "0.1.0"
description = "Productionized reproduction package for TTPXHunter report-to-MITRE ATT&CK extraction and CISA benchmarking."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "transformers>=4.40,<5",
  "torch>=2.2",
  "nltk>=3.8",
  "numpy>=1.23,<2; python_version < '3.13'",
  "numpy>=2.1.3; python_version >= '3.13'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ttpxhunter = "ttpxhunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: downloads and runs the Hugging Face TTPXHunter model",
]
